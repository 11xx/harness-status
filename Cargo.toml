[package]
name = "harness-status"
version = "0.1.0"
edition = "2024"
description = "Volatile AI harness status as snapshot JSON or a JSONL stream"
license = "Unlicense"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
libc = "0.2"
